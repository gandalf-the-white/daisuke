---
# tasks file for ansible/roles/postgres
- name: Bastille installation
  tags: bastille
  block:
    - name: Add lines proxy
      ansible.builtin.blockinfile:
        path: /usr/local/etc/pkg.conf
        marker: ";; {mark} ANSIBLE MANAGED PKG"
        block: |
          PKG_ENV {
              http_proxy: {{ http_proxy }},
              https_proxy: {{ http_proxy }},
          }

    - name: Set runtime hostname
      ansible.builtin.hostname:
        name: "{{ hostname }}"

    - name: Persist hostname in rc.conf
      community.general.sysrc:
        name: hostname
        value: "{{ hostname }}"

    - name: Install host packages
      community.general.pkgng:
        name: "{{ packages }}"
        state: present

    - name: Enable bastille at boot
      community.general.sysrc:
        name: bastille_enable
        value: "YES"

    - name: Configure Bastille loopback clone
      community.general.sysrc:
        name: cloned_interfaces
        value: lo1

    - name: Rename lo1 to bastille0
      community.general.sysrc:
        name: ifconfig_lo1_name
        value: "{{ bastille_interface }}"

    - name: Bring cloned interfaces up
      ansible.builtin.command: service netif cloneup
      changed_when: false

    - name: Bootstrap Bastille release
      ansible.builtin.command: "bastille bootstrap {{ bastille_release }}"
      args:
        creates: "/usr/local/bastille/releases/{{ bastille_release }}"

######################################
# PF CONFIGURATION
######################################

- name: PF configuration
  tags: pf
  block:
    - name: Deploy pf.conf
      ansible.builtin.template:
        src: pf.conf.j2
        dest: /etc/pf.conf
        owner: root
        group: wheel
        mode: "0644"
      # notify: reload pf

    - name: Check if pf kernel module is loaded
      ansible.builtin.command: kldstat -n pf
      register: pf_loaded
      failed_when: false
      changed_when: false

    - name: Load pf kernel module
      ansible.builtin.command: kldload pf
      when: pf_loaded.rc != 0

    - name: Enable pf at boot
      community.general.sysrc:
        name: pf_enable
        value: "YES"

    - name: Validate pf.conf
      ansible.builtin.command: pfctl -vnf /etc/pf.conf
      changed_when: false

    - name: Ensure pf is running
      ansible.builtin.service:
        name: pf
        state: started

###################################################
# CREATE JAILS
###################################################

- name: Jails management
  tags: jails
  block:
    - name: Create jails
      ansible.builtin.command: >-
        bastille create {{ item.name }} {{ bastille_release }}
        {{ item.prefix }}.{{ item.octet }} {{ bastille_interface }}
      loop: "{{ jails }}"
      args:
        creates: "/usr/local/bastille/jails/{{ item.name }}"

    - name: Copy host resolv.conf into jails
      ansible.builtin.copy:
        src: /etc/resolv.conf
        dest: "/usr/local/bastille/jails/{{ item.name }}/root/etc/resolv.conf"
        remote_src: true
        owner: root
        group: wheel
        mode: "0644"
      loop: "{{ jails }}"

    - name: Configure jail pkg proxy
      ansible.builtin.blockinfile:
        path: "/usr/local/bastille/jails/{{ item.name }}/root/usr/local/etc/pkg.conf"
        create: true
        marker: "# {mark} ANSIBLE MANAGED PKG PROXY"
        block: |
          PKG_ENV: {
            HTTP_PROXY  : "{{ http_proxy | default('') }}"
            HTTPS_PROXY : "{{ https_proxy | default('') }}"
          }
      loop: "{{ jails }}"
      when: http_proxy is defined or https_proxy is defined

    - name: Ensure jail pkg configuration directory exists
      ansible.builtin.file:
        path: "/usr/local/bastille/jails/{{ item.name }}/root/usr/local/etc"
        state: directory
        owner: root
        group: wheel
        mode: "0755"
      loop: "{{ jails }}"

    - name: Update pkg catalog in jails
      ansible.builtin.command: "bastille cmd {{ item.name }} env ASSUME_ALWAYS_YES=yes pkg update"
      loop: "{{ jails }}"
      # changed_when: false
      changed_when: "'No updates' not in jail_pkg_update.stdout"
      register: jail_pkg_update
      failed_when: jail_pkg_update.rc != 0

######################################
#  SysV IPC CONFIGURATION
######################################

- name: Allow SysV IPC in PostgreSQL jail
  ansible.builtin.command: >-
    bastille config postgres-server set allow.sysvipc 1
  register: postgres_sysvipc
  changed_when: "'allow.sysvipc' in postgres_sysvipc.stdout"

- name: Restart PostgreSQL jail after SysV IPC configuration
  ansible.builtin.command: >-
    bastille restart postgres-server
  changed_when: true

######################################
# DAEMON CONFIGURATION
######################################

- name: Daemon configuration
  tags: daemon
  block:
    - name: Install packages in jails
      ansible.builtin.command: "bastille pkg {{ item.0.name }} install -y {{ item.1 }}"
      loop: "{{ jails | subelements('packages', skip_missing=True) }}"
      register: jail_pkg_install
      changed_when: "'already installed' not in jail_pkg_install.stdout"

    - name: Enable daemons in jails
      ansible.builtin.command: "bastille sysrc {{ item.0.name }} {{ item.1 }}_enable=YES"
      loop: "{{ jails | subelements('daemons', skip_missing=True) }}"

######################################
# PF CONFIGURATION
######################################

- name: PF configuration
  tags: pf
  block:
    - name: Validate PF configuration
      become: true
      ansible.builtin.command:
        argv:
          - /sbin/pfctl
          - -nf
          - /etc/pf.conf
      changed_when: false

    - name: Reload PF configuration
      become: true
      ansible.builtin.command:
        argv:
          - /sbin/pfctl
          - -f
          - /etc/pf.conf
      changed_when: true

    - name: Reset the SSH persistent connection
      ansible.builtin.meta: reset_connection

    - name: Wait until the FreeBSD host is reachable again
      ansible.builtin.wait_for_connection:
        delay: 1
        sleep: 2
        connect_timeout: 5
        timeout: 60

######################################
# POSTGRESQL CONFIGURATION
######################################

- name: PostgreSQL configuration
  tags: postgres
  block:
    - name: Select Postgres jail
      ansible.builtin.set_fact:
        postgres_jail: "{{ jails | selectattr('name', 'equalto', 'postgres-server') | first }}"

    - name: Check PostgreSQL cluster
      ansible.builtin.command: >-
        bastille cmd postgres-server
        test -f /var/db/postgres/data17/PG_VERSION
      register: postgres_cluster
      failed_when: false
      changed_when: false

    - name: Initialize PostgreSQL cluster
      ansible.builtin.command: >-
        bastille cmd postgres-server
        service postgresql initdb
      when: postgres_cluster.rc != 0

    - name: Configure PostgreSQL listen_addresses
      ansible.builtin.lineinfile:
        path: "/usr/local/bastille/jails/{{ postgres_jail.name }}/root/var/db/postgres/data17/postgresql.conf"
        regexp: "^#?listen_addresses\\s*="
        line: "listen_addresses = '{{ postgres_jail.prefix }}.{{ postgres_jail.octet }}'"

    - name: Configure PostgreSQL HBA
      ansible.builtin.blockinfile:
        path: "/usr/local/bastille/jails/{{ postgres_jail.name }}/root/var/db/postgres/data17/pg_hba.conf"
        marker: "# {mark} ANSIBLE MANAGED NETWORK ACCESS"
        block: |
          host    all    all    {{ postgres_jail.prefix }}.0/24    scram-sha-256

    - name: Check PostgreSQL service status
      ansible.builtin.command: >-
        bastille cmd {{ postgres_jail.name }}
        service postgresql status
      register: postgres_status
      failed_when: false
      changed_when: false

    - name: Start PostgreSQL
      ansible.builtin.command: >-
        bastille cmd {{ postgres_jail.name }}
        service postgresql start
      when: postgres_status.rc != 0
      register: postgres_start
      changed_when: postgres_start.rc == 0

    - name: Check PostgreSQL
      ansible.builtin.command: >-
        bastille cmd {{ postgres_jail.name }}
        su - postgres -c "psql -d postgres -c 'SELECT version();'"
      register: postgres_version
      changed_when: false

    - name: Display PostgreSQL version
      ansible.builtin.debug:
        var: postgres_version.stdout
